name: Swagger Spec Check

on:
  pull_request:
    branches:
      - develop
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  swagger-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Check swagger spec is up to date
        run: just swagger-check
